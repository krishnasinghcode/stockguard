version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stockguard
      POSTGRES_USER: stockguard
      POSTGRES_PASSWORD: stockguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockguard
      SPRING_DATA_REDIS_HOST: redis

volumes:
  pgdata:
