spring:
  application:
    name: stockguard

  datasource:
    url: jdbc:postgresql://localhost:5432/stockguard
    username: stockguard
    password: stockguard
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

aws:
  region: us-east-1
  sqs:
    queue-url: "REPLACE_ME"